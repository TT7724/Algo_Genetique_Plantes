name: Rust CI

on:
  push:
    paths: ["ga-plantes/**"]
  pull_request:
    paths: ["ga-plantes/**"]

defaults:
  run:
    working-directory: ga-plantes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --verbose
      - name: Tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings
