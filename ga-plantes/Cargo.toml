[package]
name = "ga-plantes"
version = "0.1.0"
edition = "2021"
description = "Moteur génétique pour l'optimisation des combinaisons de plantes en bac (GA Potager)"
license = "MIT"
authors = ["GA Potager Team"]

[lib]
name = "ga_plantes"
path = "src/lib.rs"

[[bin]]
name = "ga-potager-cli"
path = "src/main.rs"

[dependencies]
# Sérialisation/Désérialisation JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Génération aléatoire
rand = "0.8"

# CLI (parsing des arguments)
clap = { version = "4.0", features = ["derive"] }

# Validation et erreurs
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
# Pour les tests unitaires
tempfile = "3.0"
